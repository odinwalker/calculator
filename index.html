<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="cal-container">

    <div id="display">
    </div>

    <div id="function">
      <button class="clear">Clear</button>
      <button class="backspace">BackSpace</button>
    </div>

    <div id="input-btn">
      <button class="number bt9">9</button>
      <button class="number bt8">8</button>
      <button class="number bt7">7</button>
      <button class="operate divide">&#247</button>
      <button class="number bt6">6</button>
      <button class="number bt5">5</button>
      <button class="number bt4">4</button>
      <button class="operate mutiply">&#215</button>
      <button class="number bt3">3</button>
      <button class="number bt2">2</button>
      <button class="number bt1">1</button>
      <button class="operate subtract">&#45</button>
      <button class="number bt0">0</button>
      <button class="dot">&#46</button>
      <button class="operate equal">&#61</button>
      <button class="operate sum">&#43</button>
    </div>

  </div>
</body>

</html>
