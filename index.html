<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles.css">
  <script src="calculator.js"></script>
</head>

<body>
  <div id="cal-container">

    <div id="display">
    </div>

    <div id="function">
      <button class="clear">Clear</button>
      <button class="backspace">BackSpace</button>
    </div>

    <div id="input-btn">
      <button class="number bt9" data-val="9">9</button>
      <button class="number bt8" data-val="8">8</button>
      <button class="number bt7" data-val="7">7</button>
      <button class="operate divide" data-op="/">&#247</button>
      <button class="number bt6" data-val="6">6</button>
      <button class="number bt5" data-val="5">5</button>
      <button class="number bt4" data-val="4">4</button>
      <button class="operate mutiply" data-op="*">&#215</button>
      <button class="number bt3" data-val="3">3</button>
      <button class="number bt2" data-val="2">2</button>
      <button class="number bt1" data-val="1">1</button>
      <button class="operate subtract" data-op="-">&#45</button>
      <button class="number bt0" data-val="0">0</button>
      <button class="dot" data-dot=".">&#46</button>
      <button class="operate equal" data-op="=">&#61</button>
      <button class="operate sum" data-op="+">&#43</button>
    </div>

  </div>
</body>

</html>
